name: ci

on:
  push:
  pull_request:

env:
  ICEBERG_VERSAO: 1.10.2
  ICEBERG_JAR: /opt/spark-jars/iceberg-spark-runtime-3.5_2.12-1.10.2.jar

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Cache do runtime Iceberg
        id: cache-iceberg
        uses: actions/cache@v4
        with:
          path: /opt/spark-jars
          key: iceberg-spark-runtime-3.5-${{ env.ICEBERG_VERSAO }}

      - name: Baixar runtime Iceberg
        if: steps.cache-iceberg.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/spark-jars && sudo chown $USER /opt/spark-jars
          curl -sSL --retry 5 --retry-delay 15 -o "$ICEBERG_JAR" \
            "https://repo1.maven.org/maven2/org/apache/iceberg/iceberg-spark-runtime-3.5_2.12/${ICEBERG_VERSAO}/iceberg-spark-runtime-3.5_2.12-${ICEBERG_VERSAO}.jar"
          test "$(stat -c%s "$ICEBERG_JAR")" -gt 1000000

      - name: Lint
        run: ruff check src tests

      - name: Testes (unitários + e2e + oráculo sobre o dataset completo)
        run: python -m pytest -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt e validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
