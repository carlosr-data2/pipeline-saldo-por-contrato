[project]
name = "pipeline-saldo-por-contrato"
version = "1.0.0"
description = "Pipeline batch de saldo por contrato (Spark + Iceberg, Glue-ready)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: testes que processam o dataset completo (~200 mil linhas)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
